name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements-dev.txt
      - run: pytest app/tests -v

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Spins up a throwaway Kubernetes cluster inside the CI runner so the
      # pipeline demonstrates a real deploy without needing a paid cloud
      # cluster. Swap this step for `aws eks update-kubeconfig ...` once
      # you're deploying to the Terraform-provisioned EKS cluster.
      - name: Create ephemeral kind cluster
        uses: helm/kind-action@v1.10.0

      - name: Deploy with Helm (rolling update)
        run: |
          helm upgrade --install reliability-api ./helm/reliability-api \
            --set image.repository=${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 120s

      - name: Verify rollout health
        run: kubectl rollout status deployment/reliability-api --timeout=60s

      - name: Smoke test the deployed service
        run: |
          kubectl port-forward svc/reliability-api 8080:80 &
          sleep 5
          curl -sf http://localhost:8080/healthz
          curl -sf http://localhost:8080/readyz
